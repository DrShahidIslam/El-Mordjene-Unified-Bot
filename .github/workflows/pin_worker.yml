name: Pinterest Pin Worker

on:
  schedule:
    - cron: '0 */3 * * *'  # Runs every 3 hours (8 times a day)
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv Pillow google-genai huggingface_hub feedparser trafilatura

      - name: Run Pinterest Worker
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_RECIPES: ${{ secrets.PINTEREST_BOARD_RECIPES }}
          PINTEREST_BOARD_TRENDS: ${{ secrets.PINTEREST_BOARD_TRENDS }}
          PINTEREST_BOARD_SALADS: ${{ secrets.PINTEREST_BOARD_SALADS }}
          PINTEREST_BOARD_DINNER: ${{ secrets.PINTEREST_BOARD_DINNER }}
          PINTEREST_BOARD_DESSERTS: ${{ secrets.PINTEREST_BOARD_DESSERTS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python pinterest_engine/pin_generator.py --worker

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add topic_queue.json bridge_page/discovery/ index.html
          git commit -m "Automation: Update pin counts and bridge site [skip ci]" || echo "No changes to commit"
          git push origin main
