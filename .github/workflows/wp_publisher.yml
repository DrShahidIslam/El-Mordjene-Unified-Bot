name: WordPress Publisher

on:
  schedule:
    - cron: '0 8,20 * * *'  # Runs at 08:00 and 20:00 UTC
  workflow_dispatch:      # Manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv Pillow google-genai huggingface_hub trafilatura beautifulsoup4

      - name: Run WordPress Publisher
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          POSTS_PER_RUN: 2
        run: python alerts_engine/main.py --once

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add topic_queue.json alerts_engine/published_posts.json
          git commit -m "Automation: Update queue and published posts [skip ci]" || echo "No changes to commit"
          git push origin main
