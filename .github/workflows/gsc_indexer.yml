name: Google Search Console Daily Indexer

on:
  schedule:
    - cron: '0 4 * * *'    # Runs daily at 04:00 AM UTC
  workflow_dispatch:      # Manual trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Submit URLs to Google Indexing API
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL || secrets.WP_URL || 'https://el-mordjene.info' }}
        run: python alerts_engine/gsc_indexer.py
